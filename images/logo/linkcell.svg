<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="lcIconTitle">
  <title id="lcIconTitle">linkcell</title>
  <desc>Sheared 3x3 linked cells, a source, four neighbours, and a periodic wrap</desc>
  <rect width="64" height="64" rx="14" fill="#1E1B4B"/>
  <!-- Sheared 3x3 mesh -->
  <g fill="none" stroke="#A5B4FC" stroke-width="1.35" stroke-linejoin="round">
    <path d="M14 22 L46 14 L54 46 L22 54 Z"/>
    <path d="M24.7 19.3 L32.7 51.3"/>
    <path d="M35.3 16.7 L43.3 48.7"/>
    <path d="M16.7 32.7 L48.7 24.7"/>
    <path d="M19.3 43.3 L51.3 35.3"/>
  </g>
  <!-- Periodic wrap of the left-face neighbour -->
  <path d="M22 40 C12 36 12 26 20 24" fill="none" stroke="#FBBF24" stroke-width="1.55" stroke-linecap="round" stroke-dasharray="2.2 1.6"/>
  <!-- Bonds, k = 4 -->
  <g stroke="#C7D2FE" stroke-width="1.25" stroke-linecap="round">
    <path d="M34 33 L27 29"/>
    <path d="M34 33 L42 25"/>
    <path d="M34 33 L44 38"/>
    <path d="M34 33 L28 42"/>
  </g>
  <circle cx="34" cy="33" r="2.55" fill="#EEF2FF"/>
  <circle cx="27" cy="29" r="2.05" fill="#FBBF24"/>
  <circle cx="42" cy="25" r="2.05" fill="#FBBF24"/>
  <circle cx="44" cy="38" r="2.05" fill="#FBBF24"/>
  <circle cx="28" cy="42" r="2.05" fill="#FBBF24"/>
</svg>
